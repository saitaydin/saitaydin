      <stop offset="0%" stop-color="#ff7600" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ff7600" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cd"><rect width="480" height="200" rx="12"/></clipPath>
    <style>.s{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#cd)">
    <rect width="480" height="200" fill="#0a0a0a"/>
    <circle cx="440" cy="20" r="105" fill="url(#gd)"/>
    <rect x="0" y="0" width="3" height="200" fill="#ff7600"/>
    <g class="s">
      <text x="30" y="46" font-size="11.5" fill="#ff7600" font-weight="700" letter-spacing=".14em">MOBILE</text>
      <text x="30" y="82" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-.3">Uptime</text>
      <text x="30" y="110" font-size="14" fill="#9a9a9a">React Native app shipped to real</text>
      <text x="30" y="136" font-size="14" fill="#9a9a9a">devices, built mobile-first.</text>
      <text x="30" y="176" font-size="12.5" fill="#6b6b6b" letter-spacing=".03em">Expo · React Native</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="478.5" height="198.5" rx="12" fill="none" stroke="#2a1a0c" stroke-width="1.5"/>

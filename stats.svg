<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="86" viewBox="0 0 1000 86" role="img" aria-label="4 products shipped · web, mobile and desktop · bilingual EN/AR with full RTL · TypeScript end to end">
  <defs>
    <clipPath id="cs"><rect width="1000" height="86" rx="12"/></clipPath>
    <style>.s{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}</style>
  </defs>
  <g clip-path="url(#cs)">
    <rect width="1000" height="86" fill="#0a0a0a"/>
    <rect x="0" y="0" width="3" height="86" fill="#ff7600"/>
    <g class="s" text-anchor="middle">
      <text x="125" y="40" font-size="23" font-weight="700" fill="#ff7600">4</text>
      <text x="125" y="62" font-size="12.5" fill="#8a8a8a">products shipped</text>

      <text x="375" y="40" font-size="23" font-weight="700" fill="#ff7600">3</text>
      <text x="375" y="62" font-size="12.5" fill="#8a8a8a">platforms · web, mobile, desktop</text>

      <text x="625" y="40" font-size="23" font-weight="700" fill="#ff7600">EN / AR</text>
      <text x="625" y="62" font-size="12.5" fill="#8a8a8a">bilingual, full RTL</text>

      <text x="865" y="40" font-size="23" font-weight="700" fill="#ff7600">TypeScript</text>
      <text x="865" y="62" font-size="12.5" fill="#8a8a8a">strict, end to end</text>
    </g>
    <line x1="250" y1="24" x2="250" y2="62" stroke="#2a1a0c" stroke-width="1.5"/>
    <line x1="500" y1="24" x2="500" y2="62" stroke="#2a1a0c" stroke-width="1.5"/>
    <line x1="750" y1="24" x2="750" y2="62" stroke="#2a1a0c" stroke-width="1.5"/>
  </g>
  <rect x=".75" y=".75" width="998.5" height="84.5" rx="12" fill="none" stroke="#2a1a0c" stroke-width="1.5"/>
